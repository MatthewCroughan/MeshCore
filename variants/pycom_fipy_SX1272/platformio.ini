[pycom_fipy_sx1272]
extends = esp32_base
board = lopy4
board_build.partitions = min_spiffs.csv
build_flags =
  ${esp32_base.build_flags}
  -I variants/pycom_fipy_SX1272
  -D PYCOM_FIPY
  -D HAS_NEOPIXEL
  -D NEOPIXEL_COUNT=1
  -D NEOPIXEL_DATA=0
  -D NEOPIXEL_TYPE="NEO_GRB+NEO_KHZ800"
  -D P_LORA_DIO_0=23
  -D P_LORA_DIO_1=23
  -D P_LORA_DIO_2=23
  -D P_LORA_NSS=18
  -D P_LORA_SCLK=5
  -D P_LORA_MISO=19
  -D P_LORA_MOSI=27
  -D P_LORA_TX_LED=0
  -D PIN_VBAT_READ=36
  -D ANT_SELECT=21
  -D PIN_BOARD_SDA=12
  -D PIN_BOARD_SCL=13
  -D USE_SX1272
  -D RADIO_CLASS=CustomSX1272
  -D WRAPPER_CLASS=CustomSX1272Wrapper
  -D SX127X_CURRENT_LIMIT=120
  -D P_LORA_RESET=RADIOLIB_NC
  -D P_LORA_BUSY=RADIOLIB_NC
  -D SX176X_RXEN=-1
  -D SX176X_TXEN=-1
  -D LORA_BW=125
  -D LORA_TX_POWER=20

build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/pycom_fipy_SX1272>
lib_deps =
  ${esp32_base.lib_deps}

[env:pycom_fipy_sx1272_companion_radio_ble]
extends = pycom_fipy_sx1272
build_flags =
  ${pycom_fipy_sx1272.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=40
  -D MAX_GROUP_CHANNELS=4
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=64
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${pycom_fipy_sx1272.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${pycom_fipy_sx1272.lib_deps}
  densaugeo/base64 @ ~1.4.0

